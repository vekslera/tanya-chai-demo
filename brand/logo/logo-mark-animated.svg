<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 54 156 156" width="156" height="156" role="img" aria-label="תניא חי" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>תניא חי (animated: beating heart, contour drawing clockwise)</title>
  <style>
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
    .draw { stroke-dasharray: 100 100; animation: draw 5s ease-in-out infinite; }
    .purify { animation: purify 5s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.07); } 24% { transform: scale(1); } 36% { transform: scale(1.04); } 50% { transform: scale(1); } }
    @keyframes draw { 0% { stroke-dashoffset: 100; opacity: 1; } 65% { stroke-dashoffset: 0; opacity: 1; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes purify { 0%, 58% { fill: #C9CEDB; } 76%, 90% { fill: #F3DDA2; } 100% { fill: #C9CEDB; } }
    @media (prefers-reduced-motion: reduce) { .beat, .draw, .purify { animation: none; } .draw { stroke-dasharray: 75 100; } }
  </style>
  <path d="M130 94 C136 82 146 74 160 74 C178 74 194 88 194 110 C194 140 164 166 130 190 C96 166 66 140 66 110 C66 88 82 74 100 74 C114 74 124 82 130 94 Z" fill="none" stroke="#EEECE6" stroke-width="7" stroke-linejoin="round"/>
  <path class="draw" pathLength="100" d="M130 94 C136 82 146 74 160 74 C178 74 194 88 194 110 C194 140 164 166 130 190 C96 166 66 140 66 110 C66 88 82 74 100 74 C114 74 124 82 130 94 Z" fill="none" stroke="#E8A317" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(130 134) scale(0.64) translate(-130 -132)">
    <g class="beat">
      <path class="purify" transform="translate(-5 0)" d="M130 94 C124 82 114 74 100 74 C82 74 66 88 66 110 C66 140 96 166 130 190 Z" fill="#C9CEDB"/>
      <path transform="translate(5 0)" d="M130 94 C136 82 146 74 160 74 C178 74 194 88 194 110 C194 140 164 166 130 190 Z" fill="#E8A317"/>
    </g>
  </g>
</svg>
